<!doctype html>
<!-- The photo's own pixels leak out (blur + scale) and the hard crop fades.
     Same treatment on the about logo. No border, radius, or drop-shadow. -->
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>09 · הילה · יעל דרוקמן</title>
  <style>
    @font-face{font-family:"VR";src:url("../../fonts/VarelaRound-hebrew.woff2") format("woff2");unicode-range:U+0590-05FF,U+FB1D-FB4F;font-display:swap}
    *{box-sizing:border-box}
    html,body{margin:0;background:#16141c;color:#f0e8d8;font:16px/1.45 VR,Georgia,serif}
    a{color:#c9a24a}
    .k{font-size:.72rem;letter-spacing:.18em;color:#c9a24a;margin:0 0 .8rem}
    h1,h2{font-weight:400;margin:0 0 .8rem}
    h1{font-size:clamp(1.6rem,4vw,2.5rem);max-width:16ch;line-height:1.2}
    h2{font-size:clamp(1.3rem,3vw,1.8rem);max-width:18ch}
    p{margin:0 0 1.2rem;color:#cfc3b0;max-width:34ch}
    .hero,.about{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center}
    .copy{padding:10vh 7vw}
    .stage{position:relative;min-height:100vh;overflow:hidden}
    .halo,.sharp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
    .halo{transform:scale(1.45);filter:blur(42px) saturate(1.15);opacity:.85;pointer-events:none}
    .sharp{
      -webkit-mask-image:radial-gradient(ellipse 62% 72% at 50% 38%,#000 46%,transparent 78%);
      mask-image:radial-gradient(ellipse 62% 72% at 50% 38%,#000 46%,transparent 78%);
    }
    .about{background:#0e0c10;min-height:85vh}
    .mark-stage{position:relative;min-height:85vh}
    .mark-halo,.mark{
      position:absolute;left:50%;top:50%;width:min(28rem,80%);
      -webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%)
    }
    .mark-halo{width:min(38rem,110%);filter:blur(48px) saturate(1.4);opacity:.55;pointer-events:none}
    .mark{
      -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 36%,transparent 70%);
      mask-image:radial-gradient(circle at 50% 50%,#000 36%,transparent 70%);
    }
    @media(max-width:800px){
      .hero,.about{grid-template-columns:1fr;min-height:auto}
      .stage{min-height:62vh}
      .mark-stage{min-height:52vh}
      .copy{padding:2.5rem 1.4rem 3rem}
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="stage" aria-hidden="false">
      <img class="halo" src="../../assets/profile-pic-dark-theme-560.webp" alt="" width="560" height="840" />
      <img class="sharp" src="../../assets/profile-pic-dark-theme-560.webp" alt="יעל דרוקמן" width="560" height="840" />
    </div>
    <div class="copy">
      <p class="k">ניסוי 09 · הילה</p>
      <h1>הרקע של התמונה יוצא החוצה ונמוג.</h1>
      <p>אין מסגרת ואין צל. העותק מאחור מוגדל ומטושטש — אפור הסטודיו זולג לעמוד. מלפנים, שוליים רכים במקום מלבן.</p>
      <p><a href="https://wa.me/972586306460">058-6306460</a></p>
    </div>
  </section>
  <section class="about">
    <div class="copy">
      <p class="k">אותו תיקון ללוגו</p>
      <h2>השחור של הקובץ לא צריך להיות קופסה.</h2>
      <p>הילה זהובה מהקובץ עצמו, והמלבן נחתך במסיכה עגולה. הזהב נשאר, הפינות נעלמות.</p>
    </div>
    <div class="mark-stage">
      <img class="mark-halo" src="../../assets/logo-black-800.webp" alt="" width="800" height="608" />
      <img class="mark" src="../../assets/logo-black-800.webp" alt="לוגו יעל דרוקמן" width="800" height="608" />
    </div>
  </section>
</body>
</html>
