<!doctype html>
<!-- Technique 5 stand-in: no fal.ai video. CSS + scroll = ink line, paper shift, seal. -->
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>05 · תנועה · יעל דרוקמן</title>
  <style>
    @font-face{font-family:"VR";src:url("../../fonts/VarelaRound-hebrew.woff2") format("woff2");unicode-range:U+0590-05FF,U+FB1D-FB4F;font-display:swap}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:#e8dcc8;color:#2a1c12;font:16px/1.5 VR,Georgia,serif}
    .stage{height:280vh;position:relative}
    .pin{position:sticky;top:0;height:100vh;overflow:hidden;background:#e8dcc8}
    .paper{position:absolute;inset:8vh 8vw;background:#f4ead8;box-shadow:0 20px 60px #0004;
      background-image:url("still-life.jpg");background-size:cover;background-position:center;transform:scale(1.08);
      transition:transform .1s linear}
    .paper:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#f4ead8f2 10%,#f4ead8cc 45%,#f4ead8ee 100%)}
    .ink{position:absolute;top:0;right:12vw;width:2px;height:0;background:#a8484a;z-index:2}
    .seal{position:absolute;left:10vw;bottom:12vh;width:6rem;height:6rem;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#c45c5c,#8c3032 70%);
      box-shadow:inset 0 0 0 3px #c9a24a, 2px 4px 0 #0002;z-index:3;
      display:grid;place-items:center;color:#f4ead8;font-size:.7rem;text-align:center;text-decoration:none;
      animation:spin 28s linear infinite}
    @keyframes spin{to{transform:rotate(-360deg)}}
    .copy{position:relative;z-index:2;padding:18vh 14vw 0;max-width:40rem}
    h1{font-size:clamp(1.8rem,4.5vw,3rem);font-weight:400;margin:0 0 .8rem}
    p{margin:0;max-width:28ch;color:#4a3828}
    .list{position:absolute;bottom:16vh;right:14vw;z-index:2;font-size:.9rem;opacity:.0;transition:opacity .2s}
    @media(max-width:700px){.copy{padding:14vh 8vw 0}.list{right:8vw}}
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="pin">
      <div class="paper" id="paper"></div>
      <div class="ink" id="ink"></div>
      <div class="copy">
        <h1>הדיו יורדת עם הגלילה.</h1>
        <p>אין סרטון. קו אחד, חותמת אחת, נייר שזז.</p>
      </div>
      <div class="list" id="list">עריכת דין · גישור · ביטוח ופיננסים<br>יעל דרוקמן · 058-6306460</div>
      <a class="seal" href="https://wa.me/972586306460">פגישה</a>
    </div>
  </div>
  <script>
    const stage=document.getElementById('stage'), paper=document.getElementById('paper'),
          ink=document.getElementById('ink'), list=document.getElementById('list');
    function tick(){
      const r=stage.getBoundingClientRect();
      const t=Math.min(1, Math.max(0, -r.top/(r.height-innerHeight)));
      paper.style.transform='scale('+(1.08-t*0.08)+') translateY('+(-t*24)+'px)';
      ink.style.height=(t*92)+'vh';
      list.style.opacity=t>.45?1:0;
    }
    addEventListener('scroll',tick,{passive:true}); tick();
  </script>
</body>
</html>
